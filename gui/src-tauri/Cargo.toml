[package]
name = "ridge-gui"
version = "0.2.0"
description = "Ridge desktop GUI: Tauri core over the Python sidecar (forensic image-enhancement aid)"
edition = "2021"
rust-version = "1.98"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "ridge_gui_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Default features; Ridge registers no plugin besides the dialog (no shell, fs, http or opener).
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"  # native open/save/folder dialogs, called from Rust only (no WebView permission)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
