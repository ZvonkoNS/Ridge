# Quality gates, kept to a minimum of GitHub Actions minutes (owner decision 2026-10-17):
# - pull requests: one Linux job (Python 3.12, the oldest supported) plus one supply-chain job;
#   documentation-only pull requests do not run CI at all. The examiner workstation gate
#   (`python tools/gate.py all` on Windows, Python 3.13) runs locally before every push.
# - Apple silicon runs only when pixel-affecting code changes (arm64.yml, PRD NFR-3).
# - the full matrix (Windows, Linux, macOS x Python 3.12-3.14, PRD NFR-5) runs on demand
#   (Actions -> CI -> Run workflow, full = true) and for release tags (v*).
# Actions are pinned by commit SHA (tag in the comment); Dependabot proposes updates.
# CodeQL and dependency review need GitHub code scanning, which private repositories on a
# personal account do not have: they run on public repos or when the repository variable
# CODE_SCANNING is 'true'. Bandit and ruff's S rules cover static analysis in the gates job.
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "Instruction_documentation/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Full matrix: Windows, Linux and macOS x Python 3.12-3.14"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Full matrix for release tags and manual runs with full = true; otherwise Linux, Python 3.12.
        os: ${{ fromJSON((github.event_name == 'push' || inputs.full) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON((github.event_name == 'push' || inputs.full) && '["3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the live v0 test loads the reference implementation from git history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Gates
        env:
          # Stored goldens: same-architecture tolerances, since CI CPUs differ from the reference
          # workstation. The live v0 comparison stays bit-identical (tests/test_characterization.py).
          RIDGE_GOLDEN_MODE: tolerant
        run: python tools/gate.py docs lint format typecheck test sast licenses

  supply-chain:
    name: dependency audit, SBOM and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans the history too
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Gates
        run: python tools/gate.py deps sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/sbom.cdx.json
          if-no-files-found: error
      - name: Install gitleaks (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan working tree and history
        run: |
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  codeql:
    name: CodeQL
    if: ${{ (!github.event.repository.private || vars.CODE_SCANNING == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2

  dependency-review:
    name: dependency review
    if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.CODE_SCANNING == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
