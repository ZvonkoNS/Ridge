# Desktop GUI gate (desktop_gui_tauri_standards.md §13): npm and cargo checks via
# `python tools/gate.py gui`. To keep GitHub Actions usage minimal (owner decision 2026-10-17),
# it runs only on demand (Actions -> GUI -> Run workflow) and for release tags (v*); the same
# gate runs locally before every push as part of `python tools/gate.py all`.
name: GUI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    name: GUI gate (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: System libraries for Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev
      - name: Python virtualenv (debug builds and the live sidecar test run .venv/bin/ridge-sidecar)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Rust supply-chain tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: GUI gate
        run: .venv/bin/python tools/gate.py gui
