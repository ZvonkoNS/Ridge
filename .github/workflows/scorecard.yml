# OpenSSF Scorecard: repository supply-chain posture (results go to code scanning).
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions: read-all

jobs:
  analysis:
    # Needs code scanning: public repos, or the CODE_SCANNING repository variable set to 'true'.
    if: ${{ (!github.event.repository.private || vars.CODE_SCANNING == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          sarif_file: results.sarif
