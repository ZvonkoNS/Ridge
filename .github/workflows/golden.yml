# Generates golden characterization results from the v0 reference on each runner type and
# uploads them as artifacts. arm64 goldens come from the Apple silicon (macos) runner.
# Review the artifact, copy tests/golden/v0-<arch>.* into the repository and record why in a
# handoff. Runs on demand only (goldens change only with an ADR and human approval), which
# also keeps GitHub Actions usage minimal.
name: Golden

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-pinned dependencies
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.lock -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Generate goldens from the v0 reference
        run: python tools/make_golden.py --out-dir build/golden
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-${{ matrix.os }}
          path: build/golden/
          if-no-files-found: error
